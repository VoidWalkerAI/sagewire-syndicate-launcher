<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageWire Syndicate Launcher</title>
    <style>
        :root { --p: #e94560; --s: #f39c12; --bg: #1a1a2e; --txt: #ffffff; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; padding: 20px; text-align: center; }
        h1 { background: linear-gradient(135deg, var(--p), var(--s)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem; font-weight: bold; margin-bottom: 30px; }
        
        .app-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; max-width: 1000px; margin: 0 auto; 
        }

        .app-card { 
            background: rgba(255,255,255,0.05); border: 1px solid #30475e; 
            border-radius: 15px; padding: 20px; text-align: left; 
            transition: 0.3s; cursor: pointer; display: flex; flex-direction: column;
        }
        .app-card:hover { transform: translateY(-5px); border-color: var(--p); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .app-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--p), var(--s)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 15px; color: white; }
        .app-name { font-size: 1.2rem; color: var(--p); font-weight: bold; margin-bottom: 8px; }
        .app-desc { color: #94a3b8; font-size: 0.9rem; flex-grow: 1; margin-bottom: 20px; line-height: 1.4; }
        .btn { background: var(--p); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>⚡ SageWire Syndicate</h1>
    <div id="appContainer" class="app-grid">
        <p style="grid-column: 1/-1;">Synchronizing with App Fleet...</p>
    </div>

    <script>
        // PASTE YOUR NEW URL FROM STEP 1 HERE
        const API_URL = 'https://script.google.com/macros/s/AKfycbxw2EMwjZR36o4Ifgq99QX4Q391nbe2OnUSMBqQvTerdXB-4uZ20yn1xcKyZ4_NaK2CmA/exec';

        async function load() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const container = document.getElementById('appContainer');
                
                if (data.apps) {
                    container.innerHTML = data.apps.map(app => `
                        <div class="app-card" onclick="window.open('${app.link}', '_blank')">
                            <div class="app-icon">${app.name.substring(0,2).toUpperCase()}</div>
                            <div class="app-name">${app.name}</div>
                            <div class="app-desc">${app.desc}</div>
                            <button class="btn">Launch App →</button>
                        </div>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('appContainer').innerHTML = "<p>Connection Error. Check API Deployment.</p>";
            }
        }
        load();
    </script>
</body>
</html>
